[versions]
agp = "9.2.0"
kotlin = "2.3.21"
ksp = "2.3.8"
# gradle-play-publisher — 4.0.0 is the AGP-9 compatible release. Uploads the
# signed AAB + release notes to Play via the Developer API (service account).
play = "4.0.0"

# Held at 1.16.0: 1.17.0+ requires compileSdk 36 and AGP 8.9.1+, both out of
# scope here (separate concerns from the dep-bump pass). Revisit alongside
# the AGP / compileSdk upgrade.
# CameraX for the live viewfinder in the attachment sheet's first grid cell.
#
# ⚠ FLOOR IS 1.4.0 — DO NOT GO BACK TO 1.3.x. Play rejects 64-bit native
# libraries whose ELF load segments are aligned to 4 KB instead of 16 KB, and
# camera-core 1.3.4 ships `libimage_processing_util_jni.so` built with
# max-page-size=4096. It was the ONLY offending library in the 0.2.11 bundle
# (versionCode 616): datastore and graphics-path were all already at
# 16384. zipalign cannot fix this — the alignment is baked into the prebuilt
# .so, so the fix is the dependency version and nothing else. 1.4.0 is the
# first release built with a 16 KB page size. `bundleRelease` now gates on this
# itself (`:app:verifyReleaseNativeAlignment`); to vet a candidate BEFORE
# pinning it, run `python tools/elfalign.py <the .aar>` on the artifact from
# dl.google.com — that is how 1.4.0 was identified as the floor.
#
# The old pin note said 1.4.x drags in androidx.lifecycle 2.9.x, whose
# NonNullableMutableLiveDataDetector crashed lintVitalAnalyzeRelease. That was
# true under AGP 8.7.3. It stopped being a reason to hold CameraX back for two
# independent reasons, both verified with
# `./gradlew :app:dependencies --configuration releaseRuntimeClasspath`:
#   1. lifecycle ALREADY resolves to 2.9.4 for every module in this project
#      (`lifecycle-runtime-ktx:2.8.7 -> 2.9.4`) — something else outvoted the
#      2.8.7 pin long ago, and 0.2.11 shipped on 2.9.4 without a lint crash
#      under AGP 9.2.0. The "held at 2.8.7" notes below are stale in the same
#      way; they describe an AGP we no longer use.
#   2. camera-lifecycle 1.4.2 only asks for lifecycle-common 2.1.0 anyway, so
#      the bump adds nothing to that conflict either way.
camerax = "1.4.2"

# Embedded photo picker — the ONLY compliant way to draw a media grid inside our
# own UI. Google Play rejected 0.2.14 for READ_MEDIA_IMAGES/VIDEO under the Photo
# and Video Permissions policy; this renders the SYSTEM picker on a SurfaceView
# inside our layout and needs no permission at all (verified: the AAR manifest
# declares none). Alpha, and gated at runtime — the composable is annotated
# @RequiresApi(34) + @RequiresExtension(extension = 34, version = 15), read out of
# the artifact's bytecode, not from docs.
photopicker = "1.0.0-alpha02"
coreKtx = "1.16.0"
# Held at 2.8.7: 2.9.x+ bundles a NonNullableMutableLiveDataDetector lint
# rule built against a newer kotlin-compiler than AGP 8.7.3 ships, causing
# lintVitalAnalyzeRelease to crash with IncompatibleClassChangeError on
# every Kotlin source file. Revisit alongside the AGP bump.
lifecycle = "2.8.7"
# Held at 1.10.1: 1.11+ requires compileSdk 36 and AGP 8.9.1+, both out of
# scope here. Revisit alongside the AGP / compileSdk upgrade.
activityCompose = "1.10.1"
# Held at 2025.06.01: BOM versions from 2025.08.00 onward transitively pin
# androidx.lifecycle to 2.9.x, whose NonNullableMutableLiveDataDetector
# lint rule crashes lintVitalAnalyzeRelease under AGP 8.7.3 with
# IncompatibleClassChangeError (Kotlin analysis API skew). 2025.06.01 is
# the highest BOM that stays on lifecycle 2.8.x. Revisit alongside AGP.
composeBom = "2025.06.01"
# Held at 2.8.5: 2.9.x transitively pulls androidx.lifecycle 2.9.x, whose
# bundled NonNullableMutableLiveDataDetector lint rule is built against a
# Kotlin analysis API newer than the one AGP 8.7.3 ships, causing
# lintVitalAnalyzeRelease to crash with IncompatibleClassChangeError on
# every Kotlin source file. Revisit alongside the AGP bump.
navigationCompose = "2.8.5"

# Haze — backdrop-blur / "liquid glass" for the floating bottom bar. Apache-2.0.
haze = "1.6.7"

# Foldable / tablet adaptive support. `androidx.window` provides the
# `WindowInfoTracker` + `FoldingFeature` flow for hinge-aware layouts.
# `material3-adaptive` ships `currentWindowAdaptiveInfo()` plus the
# `ListDetailPaneScaffold` / `SupportingPaneScaffold` / `NavigationSuiteScaffold`
# composables we lean on for the two- and three-pane modes. Both libs
# support compileSdk 35 — no Android 16 SDK install required for Phase 0.
androidxWindow = "1.4.0"
material3Adaptive = "1.1.0"

datastore = "1.2.1"
room = "2.8.4"
serialization = "1.7.3"
coroutines = "1.9.0"
securityCrypto = "1.1.0"
# Splash screen backport (Android 12 SplashScreen API surface for 26+).
# Lets us drive `windowSplashScreenBackground` / `windowSplashScreenAnimatedIcon`
# from XML and tear it down with `installSplashScreen()` in MainActivity.
coreSplashscreen = "1.0.1"
markdown = "0.27.0"

sshj = "0.39.0"
bouncycastle = "1.81"
yubikit = "2.7.0"
# Shizuku: optional shell-uid bridge for Tier-2 features (system-wide
# logcat, dumpsys, pm queries) without root. ssh.ai detects whether
# Shizuku is installed at runtime; the dependency is harmless when
# it isn't (no permissions are claimed, no service starts).
shizuku = "13.1.5"

junit = "4.13.2"
junitExt = "1.2.1"
espresso = "3.6.1"
robolectric = "4.15.1"
androidxTest = "1.6.1"
mockSshd = "2.13.2"
xerialSqlite = "3.46.1.3"

[libraries]
androidx-photopicker-compose = { group = "androidx.photopicker", name = "photopicker-compose", version.ref = "photopicker" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }

# Foldable / large-screen support.
# - `androidx-window` — `WindowInfoTracker` flow with FoldingFeature events
#   (HALF_OPENED tabletop / book postures, hinge bounds). API surface is
#   stable since 1.x; reactive Flow API gives us recomposition on fold.
# - `material3-adaptive` — `currentWindowAdaptiveInfo()`, `NavigationSuiteScaffold`,
#   `ListDetailPaneScaffold`, `SupportingPaneScaffold`. Phase 0 only needs the
#   info helper; the scaffolds come online in Phase 1+.
androidx-window = { group = "androidx.window", name = "window", version.ref = "androidxWindow" }
androidx-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "material3Adaptive" }
androidx-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "material3Adaptive" }
androidx-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "material3Adaptive" }
androidx-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-android", version.ref = "markdown" }
markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdown" }

sshj = { group = "com.hierynomus", name = "sshj", version.ref = "sshj" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }

# Yubico's official Android SDK. We use the FIDO module (CTAP2 / WebAuthn) over
# both transports — `android` provides USB host + NFC reader-mode plumbing and
# the `Connection` abstraction; `fido` rides on top of any Connection. Even
# though the bundle is published by Yubico, the FIDO2/CTAP2 protocol itself is
# vendor-neutral, so it talks to Nitrokey 3, SoloKey, Token2, and other
# spec-compliant FIDO authenticators on top of YubiKeys.
yubikit-android = { group = "com.yubico.yubikit", name = "android", version.ref = "yubikit" }
yubikit-fido = { group = "com.yubico.yubikit", name = "fido", version.ref = "yubikit" }

# Shizuku-API + Provider. `api` is the Java-side wrapper around the
# Shizuku binder service; `provider` is a tiny ContentProvider helper
# that lets the Shizuku Manager app discover us and grant permission
# without a manual intent dance.
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
apache-mina-sshd-core = { group = "org.apache.sshd", name = "sshd-core", version.ref = "mockSshd" }
xerial-sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "xerialSqlite" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
play-publisher = { id = "com.github.triplet.play", version.ref = "play" }
