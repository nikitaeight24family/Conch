name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed for changelog generation

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # Decode the release keystore from secrets and write the
      # `keystore.properties` file the build expects. The keystore lives in
      # the project root for the duration of the build only.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # sanity: keystore is non-empty and parseable
          test -s release.keystore
          keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -v >/dev/null

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          cp app/build/outputs/apk/release/app-release.apk "sshai-${VERSION}.apk"
          ls -lh "sshai-${VERSION}.apk"

      - name: Wipe keystore + properties (defense-in-depth)
        if: always()
        run: |
          rm -f release.keystore keystore.properties

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sshai-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
